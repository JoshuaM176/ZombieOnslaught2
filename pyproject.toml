[project]
name = "zombieonslaught2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "py-doubly-linked-list>=0.1.4",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120
exclude = ["spawn_rate_graph.py"]

[tool.ruff.lint]
ignore = ["DTZ"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
